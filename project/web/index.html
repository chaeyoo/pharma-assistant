<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAPV-Assistant · 제약 규제업무(RA·PV) AI 어시스턴트</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg transform='rotate(-45 16 16)'%3E%3Crect x='4' y='10' width='24' height='12' rx='6' fill='%23CBD5E1'/%3E%3Cpath d='M16 10h6a6 6 0 0 1 0 12h-6z' fill='%230F766E'/%3E%3C/g%3E%3C/svg%3E" />
<style>
  /* 브랜드 팔레트 — 제약·의료 톤의 슬레이트/틸 */
  :root {
    --brand-blue: #1E293B;      /* Slate */
    --brand-mildblue: #2563EB;  /* Blue */
    --brand-green: #0F766E;     /* Teal */
    --brand-mildgreen: #14B8A6; /* Mild Teal */
    --brand-bright: #5EEAD4;    /* Bright Teal */
    --brand-red: #DC2626;       /* Red */
    --brand-yellow: #F59E0B;    /* Amber */
    --bg: #f4f7f9; --panel: #ffffff; --panel2: #eef3f6; --line: #dde5ec;
    --text: #1b2a38; --muted: #5b7186;
    --user: var(--brand-blue); --accent: var(--brand-green); --accent2: var(--brand-mildblue);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 21px 30px; background: var(--brand-blue); color: #fff;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  header h1 { font-size: 24px; margin: 0; font-weight: 650; display: flex; align-items: center; gap: 12px; }
  header h1 svg { flex: none; }
  .info { position: relative; width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.5); color: #cfe0ed; display: inline-flex;
    align-items: center; justify-content: center; font-size: 16px; font-weight: 700;
    font-family: Georgia, serif; font-style: italic; cursor: default; user-select: none; }
  .info:hover { border-color: #fff; color: #fff; }
  .info .tip { display: none; position: absolute; top: calc(100% + 12px); right: -6px; z-index: 10;
    background: #12212f; color: #dfe9f2; font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    font-style: normal; font-weight: 400; font-size: 16.5px; line-height: 1.6;
    width: max-content; max-width: 60vw; padding: 12px 16px; border-radius: 9px;
    box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .info:hover .tip, .info:focus .tip { display: block; }
  .hspace { flex: 1; }
  .badge { font-size: 16.5px; padding: 4.5px 13.5px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); color: #cfe0ed; }
  .badge.llm { color: #12310a; background: var(--brand-bright); border-color: var(--brand-bright); font-weight: 700; }
  .badge.offline { color: var(--brand-yellow); border-color: var(--brand-yellow); }
  /* 검색 서버(MCP) 예열 상태 — 페이지를 열면 /warmup 으로 미리 깨운다(콜드스타트 숨기기) */
  .badge.warm { color: #cfe0ed; border-color: rgba(255,255,255,.35); }
  .badge.warm.ready { color: var(--brand-bright); border-color: var(--brand-bright); }
  .badge.warm.down { color: var(--brand-red); border-color: var(--brand-red); }
  /* 진행 단계(실시간) — /chat/stream 의 start/end 이벤트를 그린다 */
  .steps { font-size: 17px; color: var(--muted); line-height: 1.7; }
  .steps .step { display: flex; gap: 8px; align-items: baseline; }
  .steps .step.run { color: var(--text); }
  .steps .step .ms { opacity: .65; font-variant-numeric: tabular-nums; }
  .steps .step .hint { opacity: .6; font-size: .9em; }
  details.timeline { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 9px; font-size: 16px; color: var(--muted); }
  details.timeline summary { cursor: pointer; }
  details.timeline .steps { margin-top: 6px; font-size: 15px; }
  button.ghost { font-size: 18px; padding: 7.5px 18px; border-radius: 999px; cursor: pointer;
    background: transparent; border: 1px solid rgba(255,255,255,.35); color: #cfe0ed; }
  button.ghost:hover { border-color: #fff; color: #fff; }
  main { flex: 1; overflow-y: auto; padding: 30px; max-width: 1290px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 24px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { padding: 18px 22.5px; border-radius: 18px; max-width: 88%; white-space: pre-wrap;
    line-height: 1.6; font-size: 21px; }
  .msg.user .bubble { background: var(--user); color: #fff; }
  .msg.bot .bubble { background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 1.5px 4.5px rgba(30,41,59,.06); }
  .meta { margin-top: 13.5px; display: flex; gap: 9px; flex-wrap: wrap; }
  .pill { font-size: 16.5px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { color: var(--brand-green); border-color: var(--brand-green); background: #eaf5ee; }
  .pill.warn { color: var(--brand-red); border-color: var(--brand-red); background: #fdedf0; }
  .pill.mask { color: #6d5200; border-color: var(--brand-yellow); background: #fff6dd; }
  .trace { margin-top: 13.5px; font-size: 18px; color: var(--muted); }
  .trace .tool { display: inline-block; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 9px; padding: 3px 12px; margin: 3px 6px 3px 0; }
  .cites { margin-top: 15px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .cite { font-size: 18px; color: var(--muted); margin: 4.5px 0; }
  .cite b { color: var(--accent2); }
  .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
  .chip { font-size: 18px; padding: 17px 16.5px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); cursor: pointer; color: var(--text); font-family: inherit; text-align: center; }
  .chip.wide { grid-column: 1 / -1; }
  .chip:hover { border-color: var(--brand-green); background: #eaf5ee; }
  @media (max-width: 640px) { .chips { grid-template-columns: 1fr; } }
  footer { border-top: 1px solid var(--line); padding: 21px 30px; background: var(--panel); }
  .inputrow { display: flex; gap: 15px; max-width: 1290px; margin: 0 auto; align-items: flex-end; }
  /* 초기 한 줄 높이로 시작, 입력에 따라 최대 3줄까지 자동 확장 —
     실제 높이는 min/max-height 로 클램프되므로 autoResize()는 수치를 몰라도 된다 */
  textarea#q { flex: 1; box-sizing: border-box; height: 60px; min-height: 60px; max-height: 123px;
    padding: 13px 21px; border-radius: 15px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); font-size: 21px; font-family: inherit;
    resize: none; line-height: 1.5; }
  button#send { padding: 16.5px 30px; border-radius: 15px; border: none; background: var(--brand-green);
    color: #fff; font-weight: 700; cursor: pointer; font-size: 21px; }
  button#send:hover { background: #00662b; }
  button#send:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid var(--brand-mildblue); outline-offset: 2px; }
  .empty { color: var(--muted); text-align: center; margin-top: 60px; margin-bottom: 54px; font-size: 19.5px; line-height: 1.8; }
  .typing { display: inline-flex; gap: 6px; align-items: center; margin-right: 9px; }
  .typing i { width: 9px; height: 9px; border-radius: 50%; background: var(--brand-green);
    animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  /* 해상도 낮은 노트북(≤1440px) 대응: 입력창·전송 버튼·말풍선·예시 칩과 여백 축소 (입력창 한 줄 48px, 최대 3줄 96px)
     주의: 기본 규칙보다 뒤에 선언되어야 같은 우선순위에서 이긴다 — 스타일시트 맨 끝 유지 */
  @media (max-width: 1440px) {
    header { padding: 12px 20px; }
    header h1 { font-size: 18px; }
    main { padding: 18px 20px; }
    footer { padding: 12px 20px; }
    textarea#q { font-size: 16px; padding: 11px 16px; height: 48px; min-height: 48px; max-height: 96px; }
    button#send { font-size: 16px; padding: 12px 22px; }
    .empty { font-size: 14px; line-height: 1.7; margin-top: 24px; margin-bottom: 20px; }
    .chips { gap: 8px; margin-bottom: 12px; }
    .chip { font-size: 14px; padding: 9px 10px; }
    .msg { margin-bottom: 14px; }
    .bubble { font-size: 17px; padding: 10px 14px; border-radius: 12px; max-width: 80%; }
    .meta { margin-top: 8px; gap: 6px; }
    .pill { font-size: 11.5px; padding: 2px 8px; }
    .trace, .cite { font-size: 12.5px; }
    .steps { font-size: 13px; }
    details.timeline { font-size: 12.5px; }
    details.timeline .steps { font-size: 12px; }
    .trace { margin-top: 8px; }
    .trace .tool { padding: 2px 8px; }
    .cites { margin-top: 9px; padding-top: 7px; }
  }
  .user { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: #cbd5e1; }
  .user #userName { color: #fff; font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user #quota { font-variant-numeric: tabular-nums; }
  .user a { color: #cbd5e1; text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 640px) { .user #userName { max-width: 120px; } .user #quota { display: none; } }
</style>
</head>
<body>
  <header>
    <h1>
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <g transform="rotate(-45 16 16)">
          <rect x="4" y="10" width="24" height="12" rx="6" fill="#E2E8F0"/>
          <path d="M16 10h6a6 6 0 0 1 0 12h-6z" fill="#14B8A6"/>
        </g>
      </svg>
      RAPV-Assistant
    </h1>
    <span class="hspace"></span>
    <span id="mode" class="badge">연결 중…</span>
    <span id="warm" class="badge warm" hidden title="검색 서버(MCP)를 미리 깨웁니다 — 요청이 없으면 0대로 내려가 첫 질문에 콜드스타트가 끼기 때문">검색 서버 준비 중…</span>
    <button id="reset" class="ghost" aria-label="대화 초기화">새 대화</button>
    <span id="user" class="user" hidden><span id="userName"></span><span id="quota"></span><a href="/logout">로그아웃</a></span>
    <span class="info" tabindex="0" role="note" aria-label="서비스 정보">i<span class="tip">제약 규제업무(RA·PV) AI 어시스턴트 · RAG + MCP + Agent<span id="stats"></span></span></span>
  </header>

  <main id="log">
    <div class="empty" id="empty">
      안녕하세요! 제약 규제업무(RA·PV)를 돕는 AI 어시스턴트입니다.<br/>
      허가 절차·기한, GMP, 라벨링, 이상사례 보고까지 — 궁금한 내용을 물어보시면 사내 규제문서를 근거로 답해 드려요.<br/>
      모든 답변에는 참고한 문서의 출처가 함께 표시되어 바로 확인하실 수 있습니다.<br/>
      아래 예시 질문으로 시작해 보세요. 👇
    </div>
    <div class="chips" id="chips"></div>
  </main>

  <footer>
    <div class="inputrow">
      <textarea id="q" rows="1" placeholder="예) 중대한 이상사례는 며칠 안에 보고해야 하나요? (Shift+Enter 줄바꿈)"
        aria-label="질문 입력" autocomplete="off"></textarea>
      <button id="send" aria-label="질문 전송">전송</button>
    </div>
  </footer>

<script>
// wide: 긴 케이스 서술 예시 — 칩 그리드에서 한 줄 전체를 차지
const EXAMPLES = [
  { q: "품목허가 심사 기간은 얼마나 걸리나요?" },
  { q: "중대한 이상사례는 며칠 안에 보고해야 하나요?" },
  { q: "환자가 복용 후 아나필락시스로 입원했습니다. 언제까지 보고해야 하나요?" },
  { q: "이번 주 마감 임박한 규제 업무 알려줘" },
  { q: "45세 남성 환자가 A정 복용 후 두드러기로 입원, 중단 후 호전됐습니다. 의사 보고 케이스인데 KAERS 보고서 초안 만들어줘", wide: true },
  { q: "변경허가 준비 체크리스트 알려줘" },
  { q: "GMP 데이터 완전성(ALCOA) 원칙이 뭐야?" },
];
const log = document.getElementById('log');
const empty = document.getElementById('empty');
const chips = document.getElementById('chips');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const resetBtn = document.getElementById('reset');

EXAMPLES.forEach(x => {
  const c = document.createElement('button');
  c.type = 'button';
  c.className = 'chip' + (x.wide ? ' wide' : '');
  c.textContent = x.q;
  c.onclick = () => { input.value = x.q; send(); };
  chips.appendChild(c);
});

// 로그인 상태 — 로그인이 꺼진 로컬 실행이면 사용자 칸을 숨긴 채 그대로 쓴다.
function showQuota(remaining, limit) {
  const q = document.getElementById('quota');
  q.textContent = (remaining === null || remaining === undefined) ? '' : `오늘 ${remaining}${limit ? '/' + limit : ''}회 남음`;
}
let dailyLimit = null;
fetch('/api/me').then(r => {
  if (r.status === 401) { location.href = '/login'; return null; }
  return r.json();
}).then(me => {
  if (!me || !me.auth_enabled) return;
  dailyLimit = me.daily_limit;
  document.getElementById('userName').textContent = me.name || me.email;
  document.getElementById('userName').title = me.email;
  showQuota(me.remaining, me.daily_limit);
  document.getElementById('user').hidden = false;
}).catch(() => {});

fetch('/health').then(r => r.json()).then(h => {
  const b = document.getElementById('mode');
  b.textContent = h.mode === 'llm' ? 'LLM 모드' : '오프라인 모드';
  b.className = 'badge ' + h.mode;
  b.title = h.banner;
  if (h.rag) document.getElementById('stats').textContent = ` · 문서 ${h.rag.docs} · 청크 ${h.rag.chunks}`;
}).catch(() => { document.getElementById('mode').textContent = '오프라인'; });

// 검색 서버(MCP) 예열 — 페이지를 여는 순간 깨워서, 사용자가 질문을 읽고 타이핑하는
// 동안 콜드스타트(모델 로드·색인, 수십 초)가 진행되게 한다. 전송은 막지 않는다:
// 준비 전에 보내도 스트림의 '검색 서버 연결' 단계가 기다리는 이유를 보여 준다.
(function warmup() {
  const w = document.getElementById('warm');
  w.hidden = false;
  const t0 = performance.now();
  fetch('/warmup').then(r => r.json()).then(h => {
    const sec = ((performance.now() - t0) / 1000).toFixed(1);
    if (h.status === 'ok') {
      w.textContent = sec > 2 ? `검색 서버 준비됨 (${sec}s)` : '검색 서버 준비됨';
      w.className = 'badge warm ready';
      setTimeout(() => { w.hidden = true; }, 8000);
    } else {
      w.textContent = '검색 서버 응답 없음';
      w.className = 'badge warm down';
    }
  }).catch(() => { w.textContent = '검색 서버 응답 없음'; w.className = 'badge warm down'; });
})();

function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// 사용자가 위로 스크롤해 읽는 중이면 강제 스크롤하지 않는다(하단 근접 시에만 따라감).
function nearBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 180; }
function scrollDown(force) { if (force || nearBottom()) log.scrollTop = log.scrollHeight; }

function addMsg(role, text) {
  empty.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  wrap.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  log.appendChild(wrap);
  scrollDown(role === 'user');
  return wrap.querySelector('.bubble');
}

function renderBot(bubble, data) {
  const stick = nearBottom();
  let html = esc(data.answer);
  const hasWeb = (data.web_results || []).length > 0;
  // 근거 상태 배지: 도구 근거 확보 여부 — 오프라인 모드에서 False 는 회피(abstention),
  // LLM 모드에서 False 는 모델이 도구 근거 없이 답했다는 뜻(둘 다 실무 참고 금지 신호).
  // 인터넷 검색 답변은 사내 근거가 아니므로 grounded=False 이되, 원인이 다르다 —
  // '근거 없음'이 아니라 '웹 근거(사내 규정 아님)'로 구분해 표시한다(명시와 분리).
  const gb = data.grounded === false
    ? (hasWeb
        ? `<span class="pill warn">🌐 인터넷 검색 근거 — 사내 규정 근거 아님(원문 확인 필요)</span>`
        : `<span class="pill warn">⚠ 도구 근거 없음 — 실무 참고 금지</span>`)
    : `<span class="pill ok">✓ 도구 근거 확보</span>`;
  const lat = (typeof data.latency_ms === 'number')
    ? `<span class="pill">⚡ ${data.latency_ms} ms</span>` : '';
  // PII 마스킹 배지: 개인정보가 외부 LLM/로그로 나가기 전에 마스킹됐음을 표시
  const red = (data.redactions && data.redactions.length)
    ? `<span class="pill mask">🔒 개인정보 마스킹: ${data.redactions.map(r => `${esc(r.type)} ${r.count}건`).join(', ')}</span>` : '';
  // 사후 검증 배지: 답변 속 수치·날짜·방향 한정어가 근거/도구 결과와 대조됐음을 표시
  let ver = '';
  if (data.verification && typeof data.verification.ok === 'boolean') {
    const v = data.verification;
    if (v.ok) {
      ver = v.checked ? `<span class="pill ok">🔍 수치 검증 통과 (${v.checked}건 대조)</span>` : '';
      // 케이스 유래 지지 라벨: 경고는 아니지만 근거의 '등급'이 다르다 —
      // 이 수치의 지지 근거는 규정·도구가 아니라 사용자의 케이스 서술이다.
      if ((v.case_origin || []).length)
        ver += ` <span class="pill">📝 케이스 서술 유래: ${v.case_origin.map(esc).join(', ')}</span>`;
      // 웹 유래 지지 라벨: 이 수치의 지지 근거는 사내 규정·도구가 아니라
      // 인터넷 검색 결과다 — 검증 통과 배지 아래에서 사내 근거처럼 읽히지 않게 구분.
      if ((v.web_origin || []).length)
        ver += ` <span class="pill">🌐 웹 검색 유래: ${v.web_origin.map(esc).join(', ')}</span>`;
    } else {
      const qOrigin = new Set(v.question_origin || []);
      const halluc = (v.unsupported || []).filter(c => !qOrigin.has(c));
      const parts = [];
      if (halluc.length) parts.push(`미확인 ${halluc.map(esc).join(', ')}`);
      if (qOrigin.size) parts.push(`질문 전제 확인 필요 ${[...qOrigin].map(esc).join(', ')}`);
      if ((v.direction_conflicts || []).length) parts.push(`방향 반대 ${v.direction_conflicts.map(esc).join(', ')}`);
      if ((v.role_conflicts || []).length) parts.push(`날짜 역할 불일치 ${v.role_conflicts.map(esc).join(', ')}`);
      if ((v.superseded_cited || []).length) parts.push(`폐지본 인용 ${v.superseded_cited.map(esc).join(', ')}`);
      ver = `<span class="pill warn">🔍 검증 경고: ${parts.join(' · ')}</span>`;
    }
  }
  html += `<div class="meta">${gb}${lat}${red}${ver}</div>`;
  if (data.tool_calls && data.tool_calls.length) {
    html += `<div class="trace">🔧 호출한 MCP 도구: ` +
      data.tool_calls.map(t => `<span class="tool">${esc(t.name)} · ${esc(t.summary||'')}</span>`).join('') +
      `</div>`;
  }
  if (data.citations && data.citations.length) {
    html += `<div class="cites">📄 근거 출처:` +
      data.citations.map(c => {
        const ver = c.version ? ` <span style="opacity:.55">v${esc(c.version)} · 시행 ${esc(c.effective_date||'')}</span>` : '';
        return `<div class="cite"><b>${esc(c.title||'')}</b> › ${esc(c.section||'')} <span style="opacity:.6">(${esc(c.source||'')})</span>${ver}</div>`;
      }).join('') +
      `</div>`;
  }
  // 인터넷 검색 결과는 사내 근거 출처(📄)와 '다른 블록'으로 분리해 그린다 —
  // 한 목록에 섞으면 웹 결과가 규제문서 출처처럼 읽힌다(명시와 분리).
  if (hasWeb) {
    html += `<div class="cites">🌐 인터넷 검색 출처 <span style="opacity:.6">(사내 규제문서 아님)</span>:` +
      data.web_results.map(w =>
        `<div class="cite"><b>${esc(w.title||'')}</b> <span style="opacity:.6">${esc(w.url||'')}</span></div>`
      ).join('') +
      `</div>`;
  }
  bubble.innerHTML = html;
  scrollDown(stick);
}

// 멀티턴: 최근 대화 이력을 유지해 후속질문("그럼 그건?")이 맥락을 잇게 한다.
const history = [];
let busy = false; // Enter 키는 sendBtn.disabled 를 무시하므로 별도 가드

// 진행 단계 라벨 — 서버 이벤트 이름(span name)을 사람이 읽는 말로. 모르는 이름은 그대로.
const TOOL_LABEL = {
  search_regulations: '규정 검색', assess_adverse_event: '이상사례 판정', draft_ae_report: '보고서 초안 작성',
  get_ra_deadlines: '마감일 조회', get_submission_checklist: '체크리스트 조회', search_web: '인터넷 검색',
};
function stepLabel(name) {
  if (name === 'mcp.connect') return '검색 서버 연결';
  if (name === 'verify') return '수치·날짜 검증';
  if (name.startsWith('tool.')) { const t = name.slice(5); return TOOL_LABEL[t] || ('도구 ' + t); }
  if (name.startsWith('llm.step')) return `답변 생성 (${parseInt(name.slice(8), 10) + 1}회차)`;
  if (name.startsWith('llm.')) return '답변 생성';
  return name;
}
function stepsHtml(steps) {
  return '<div class="steps">' + steps.map(st => {
    const icon = st.done ? (st.ok ? '✓' : '✗') : '⏳';
    const ms = st.done && typeof st.ms === 'number' ? `<span class="ms">${Math.round(st.ms).toLocaleString()} ms</span>` : '';
    const hint = (!st.done && st.name === 'mcp.connect') ? '<span class="hint">처음이면 최대 1분</span>' : '';
    return `<div class="step${st.done ? '' : ' run'}">${icon} ${esc(st.label)} ${ms}${hint}</div>`;
  }).join('') + '</div>';
}
// 사후 타임라인 — 스트림으로 모은 단계가 없으면(폴백 경로) 응답의 trace 로 만든다.
function timelineHtml(steps, data) {
  let list = steps;
  if (!list.length && Array.isArray(data.trace)) {
    list = data.trace.filter(sp => sp.kind !== 'agent')
      .map(sp => ({ name: sp.name, label: stepLabel(sp.name), ms: sp.ms, ok: sp.ok !== false, done: true }));
  }
  if (!list.length) return '';
  const total = (typeof data.latency_ms === 'number') ? ` · 총 ${Math.round(data.latency_ms).toLocaleString()} ms` : '';
  return `<details class="timeline"><summary>⏱ 처리 단계 ${list.length}${total}</summary>${stepsHtml(list)}</details>`;
}

// 스트림 이벤트를 받아 말풍선의 진행 단계를 갱신한다. agent span(요청 전체)은 생략.
function applyEvent(steps, ev) {
  if (ev.kind === 'agent') return;
  if (ev.type === 'start') {
    steps.push({ name: ev.name, label: stepLabel(ev.name), done: false });
  } else if (ev.type === 'end') {
    let st = null;
    for (let k = steps.length - 1; k >= 0; k--) if (steps[k].name === ev.name && !steps[k].done) { st = steps[k]; break; }
    if (!st) { st = { name: ev.name, label: stepLabel(ev.name) }; steps.push(st); }
    st.done = true; st.ms = ev.ms; st.ok = ev.ok !== false;
  }
}

// POST+JSON 이라 EventSource 를 못 쓴다 — fetch 응답 본문을 읽어 SSE(data: 줄)를 직접 파싱한다.
async function readSse(res, onEvent) {
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let k;
    while ((k = buf.indexOf('\n\n')) !== -1) {
      const block = buf.slice(0, k); buf = buf.slice(k + 2);
      for (const line of block.split('\n')) {
        if (line.startsWith('data: ')) { try { onEvent(JSON.parse(line.slice(6))); } catch (_) {} }
      }
    }
  }
}

async function send() {
  const message = input.value.trim();
  if (!message || busy) return;
  busy = true;
  input.value = '';
  autoResize();
  chips.style.display = 'none';
  addMsg('user', message);
  const bubble = addMsg('bot', '');
  const typing = '<span class="typing"><i></i><i></i><i></i></span>';
  bubble.innerHTML = typing + '규제문서를 검색하고 있습니다…';
  sendBtn.disabled = true;
  const steps = [];
  const body = JSON.stringify({ message, history });
  const headers = { 'Content-Type': 'application/json' };
  const finish = (data) => {
    if (data.remaining_today !== null && data.remaining_today !== undefined) showQuota(data.remaining_today, dailyLimit);
    renderBot(bubble, data);
    bubble.insertAdjacentHTML('beforeend', timelineHtml(steps, data));
    history.push({ role: 'user', content: message });
    history.push({ role: 'assistant', content: data.answer });
    while (history.length > 6) history.shift();
  };
  try {
    let res = await fetch('/chat/stream', { method: 'POST', headers, body });
    if (res.status === 401) { location.href = '/login'; return; }
    if (res.status === 429) {
      const err = await res.json().catch(() => ({}));
      bubble.textContent = err.detail || '오늘 사용 가능한 질문 횟수를 모두 썼습니다.';
      showQuota(0, dailyLimit);
      return;
    }
    if (res.ok && res.body && (res.headers.get('content-type') || '').includes('text/event-stream')) {
      let result = null, error = null;
      await readSse(res, ev => {
        if (ev.type === 'result') { result = ev; return; }
        if (ev.type === 'error') { error = ev.message; return; }
        applyEvent(steps, ev);
        const stick = nearBottom();
        bubble.innerHTML = typing + stepsHtml(steps);
        scrollDown(stick);
      });
      if (result) { finish(result); return; }
      throw new Error(error || '응답이 끝나기 전에 연결이 끊겼습니다');
    }
    // 스트림을 못 쓰는 환경(프록시가 SSE 를 막는 경우 등) — 동기 /chat 로 1회 폴백
    res = await fetch('/chat', { method: 'POST', headers, body });
    if (res.status === 401) { location.href = '/login'; return; }
    if (!res.ok) throw new Error(`서버 오류 (HTTP ${res.status})`);
    finish(await res.json());
  } catch (e) {
    bubble.textContent = '오류가 발생했습니다: ' + (e.message || e);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    focusEnd();
  }
}

resetBtn.onclick = () => {
  history.length = 0;
  log.querySelectorAll('.msg').forEach(m => m.remove());
  empty.style.display = '';
  chips.style.display = '';
  input.value = '';
  autoResize();
  focusEnd();
};

// 긴 케이스 서술 입력 대비: 내용만큼 높이를 늘리고,
// 한 줄~3줄 범위 클램프는 CSS min/max-height 가 담당(해상도별로 수치가 달라 JS에 두지 않음)
function autoResize() {
  input.style.height = 'auto';
  input.style.height = (input.scrollHeight + 2) + 'px';
}
input.addEventListener('input', autoResize);

// 포커스를 입력창으로 되돌리고 커서를 텍스트 맨 뒤에 유지
function focusEnd() {
  input.focus();
  const end = input.value.length;
  input.setSelectionRange(end, end);
}

sendBtn.onclick = send;
input.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey) return;
  if (e.isComposing || e.keyCode === 229) return; // 한글 IME 조합 중 Enter 중복 전송 방지
  e.preventDefault();
  send();
});
focusEnd();
</script>
</body>
</html>
