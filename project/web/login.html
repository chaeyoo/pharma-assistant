<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로그인 · RAPV-Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg transform='rotate(-45 16 16)'%3E%3Crect x='4' y='10' width='24' height='12' rx='6' fill='%23CBD5E1'/%3E%3Cpath d='M16 10h6a6 6 0 0 1 0 12h-6z' fill='%230F766E'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --slate: #1E293B; --teal: #0F766E; --teal-soft: #14B8A6; --red: #DC2626;
    --bg: #f4f7f9; --panel: #ffffff; --line: #dde5ec; --text: #1b2a38; --muted: #5b7186;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--text); }
  header { padding: 18px 24px; background: var(--slate); color: #fff;
    display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 650; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 32px 28px; box-shadow: 0 6px 24px rgba(30,41,59,.06); }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 22px; color: var(--muted); line-height: 1.6; font-size: 15px; }
  a.google { display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 13px 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
    color: var(--text); text-decoration: none; font-weight: 600; font-size: 15px; }
  a.google:hover { border-color: var(--teal); background: #f0fdfa; }
  .err { display: none; margin: 0 0 18px; padding: 11px 13px; border-radius: 9px;
    background: #fef2f2; color: var(--red); font-size: 14px; line-height: 1.5; }
  .note { margin: 22px 0 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
  <header>
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
      <g transform="rotate(-45 16 16)">
        <rect x="4" y="10" width="24" height="12" rx="6" fill="#E2E8F0"/>
        <path d="M16 10h6a6 6 0 0 1 0 12h-6z" fill="#14B8A6"/>
      </g>
    </svg>
    RAPV-Assistant
  </header>
  <main>
    <div class="card">
      <h1>로그인</h1>
      <p>제약 규제업무(RA·PV) AI 어시스턴트입니다. Google 계정으로 로그인하면 바로 이용할 수 있어요.</p>
      <div class="err" id="err"></div>
      <a class="google" href="/auth/google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        Google 계정으로 계속하기
      </a>
      <p class="note">로그인 정보는 이용자 확인과 하루 이용 횟수 관리에만 쓰입니다. 질문에 환자 실명·연락처 같은 개인정보는 넣지 말아 주세요.</p>
    </div>
  </main>
<script>
  const e = new URLSearchParams(location.search).get('error');
  const msg = { denied: '이 계정은 아직 이용 권한이 없습니다. 관리자에게 초대를 요청해 주세요.',
                failed: '로그인에 실패했습니다. 다시 시도해 주세요.' }[e];
  if (msg) { const el = document.getElementById('err'); el.textContent = msg; el.style.display = 'block'; }
</script>
</body>
</html>
